 <circle cx="306" cy="744" r="13" fill="#e8f6f0"/><text x="301" y="749" font-size="15" fill="#319c7b">＋</text><text x="332" y="749" font-size="14" font-weight="700" fill="#342d48">Take a short break</text>
 <rect x="890" y="232" width="257" height="158" rx="20" fill="#fff" filter="url(#shadow)"/><text x="916" y="268" font-size="16" font-weight="800" fill="#342d48">Your progress</text><circle cx="959" cy="324" r="34" fill="none" stroke="#eee8fa" stroke-width="9"/><path d="M959 290a34 34 0 0 1 29 52" fill="none" stroke="#8b71d8" stroke-width="9" stroke-linecap="round"/><text x="942" y="330" font-size="17" font-weight="800" fill="#342d48">33%</text><text x="1007" y="318" font-size="12" fill="#8d849d">One completed</text><text x="1007" y="337" font-size="12" fill="#8d849d">step at a time.</text>
 <rect x="890" y="408" width="257" height="156" rx="20" fill="#fff" filter="url(#shadow)"/><text x="916" y="445" font-size="11" font-weight="800" letter-spacing="1.3" fill="#8064d4">UP NEXT</text><text x="916" y="479" font-size="17" font-weight="800" fill="#342d48">Study session</text><text x="916" y="503" font-size="13" fill="#9289a4">A flexible 20-minute block</text><rect x="916" y="522" width="147" height="27" rx="9" fill="#f0eafe"/><text x="929" y="540" font-size="11" font-weight="700" fill="#7457ce">View your plan  →</text>
 <rect x="890" y="580" width="257" height="179" rx="20" fill="#f4efff" stroke="#e8defd"/><text x="916" y="620" font-size="22" fill="#8568d1">✳</text><text x="916" y="652" font-size="16" font-weight="800" fill="#5d477f">A gentle reminder</text><text x="916" y="681" font-size="13" fill="#82759c">If something doesn't go as</text><text x="916" y="701" font-size="13" fill="#82759c">planned, you can adjust and</text><text x="916" y="721" font-size="13" fill="#82759c">try again when you're ready.</text>
