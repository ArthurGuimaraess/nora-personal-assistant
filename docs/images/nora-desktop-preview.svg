 <text x="270" y="46" font-size="14" font-weight="700" fill="#645b79">✳  My Day</text>
 <text x="1030" y="45" font-size="12" fill="#988fa8">MON, 24 NOV</text><circle cx="1137" cy="38" r="19" fill="#f0eafe"/><text x="1131" y="43" font-size="13" font-weight="700" fill="#7457ce">A</text>
 <text x="274" y="129" font-size="11" font-weight="800" letter-spacing="2" fill="#8064d4">A DAY AT A TIME</text>
 <text x="274" y="171" font-size="34" font-weight="800" fill="#28223b">Your day, your pace <tspan fill="#8a70d7">✳</tspan></text>
 <text x="274" y="199" font-size="16" fill="#9189a3">A calmer place to organize what matters today.</text>
 <rect x="925" y="145" width="222" height="48" rx="13" fill="#7658ce" filter="url(#shadow)"/><text x="956" y="175" font-size="14" font-weight="700" fill="#fff">＋  Add a small step</text>
