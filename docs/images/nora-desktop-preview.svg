<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">NORA desktop dashboard preview</title><desc id="desc">Illustrative desktop interface showing NORA's calm daily dashboard, small-step planning, progress and gentle reminder cards.</desc>
<defs>
