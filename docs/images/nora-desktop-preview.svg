 <text x="39" y="606" font-size="22" fill="#8568d1">✦</text>
 <text x="39" y="635" font-size="13" font-weight="700" fill="#7055b7">You don't have</text><text x="39" y="654" font-size="13" font-weight="700" fill="#7055b7">to do everything</text><text x="39" y="673" font-size="13" font-weight="700" fill="#7055b7">at once.</text>
