 <text x="306" y="273" font-size="11" font-weight="800" letter-spacing="1.3" fill="#fff">YOUR DAY, AT YOUR PACE</text>
 <text x="306" y="321" font-size="31" font-weight="800" fill="#fff">Small steps.</text><text x="306" y="357" font-size="31" font-weight="800" fill="#fff">Meaningful progress.</text>
 <text x="306" y="389" font-size="15" fill="#f1eaff">You don't have to do it all now.</text><text x="306" y="412" font-size="15" fill="#f1eaff">One thing at a time is enough.</text>
