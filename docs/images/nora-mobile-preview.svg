 <text x="28" y="50" font-size="19" font-weight="800" fill="#4c3a73">✳ nora<tspan fill="#a994dc">.</tspan></text><circle cx="433" cy="42" r="18" fill="#f0eafe"/><text x="427" y="47" font-size="14" font-weight="800" fill="#7658ce">A</text>
