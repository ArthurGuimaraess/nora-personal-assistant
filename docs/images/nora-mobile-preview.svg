 <text x="57" y="270" font-size="11" font-weight="800" letter-spacing="1.2" fill="#fff">YOUR DAY, AT YOUR PACE</text>
 <text x="57" y="322" font-size="28" font-weight="800" fill="#fff">Small steps.</text><text x="57" y="356" font-size="28" font-weight="800" fill="#fff">Meaningful progress.</text>
 <text x="57" y="390" font-size="14" fill="#f1eaff">You don't have to do it all now.</text><text x="57" y="412" font-size="14" fill="#f1eaff">One thing at a time is enough.</text>
